
name: Extract Sakura Starter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          if [ -f sakura-manager-v3-starter.zip ]; then
            unzip -o sakura-manager-v3-starter.zip -d .
            rm sakura-manager-v3-starter.zip
          fi
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract Sakura Manager V3 starter"
          git push
